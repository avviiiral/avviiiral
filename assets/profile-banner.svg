  <circle cx="1035" cy="146" r="76" fill="none" stroke="#f59e0b" stroke-opacity=".17"/>
  <path d="M900 55L1000 105L950 170L1080 210L1150 135" fill="none" stroke="#fbbf24" stroke-opacity=".4" stroke-width="2"/>
  <g fill="#fbbf24"><circle cx="900" cy="55" r="4"/><circle cx="1000" cy="105" r="4"/><circle cx="950" cy="170" r="4"/><circle cx="1080" cy="210" r="4"/><circle cx="1150" cy="135" r="4"/></g>
