<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Aviral Goyal — AI/ML Engineer and Full-Stack Developer</title>
  <desc id="desc">A premium midnight-black and amber developer banner highlighting AI, machine learning, Python, full-stack development, and data analytics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080b10"/><stop offset="1" stop-color="#141922"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#f59e0b" stroke-opacity=".08" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
  <rect x="0" y="0" width="8" height="300" rx="4" fill="url(#accent)"/>
  <circle cx="1035" cy="146" r="152" fill="#f59e0b" opacity=".045"/>
